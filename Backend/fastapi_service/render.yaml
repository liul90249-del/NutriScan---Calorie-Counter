services:
  - type: web
    name: nutriscan-ai-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: MAX_IMAGE_BYTES
        value: "6291456"
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "30"
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_COACH_MODEL
        value: deepseek-flash
      - key: DEEPSEEK_COACH_MAX_TOKENS
        value: "1800"
      - key: NUTRISCAN_CLIENT_TOKEN
        sync: false
